# Split role
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Battery reporting
CONFIG_ZMK_BATTERY=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Power settings
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# No sleep for dongle
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=0

# Display - 128x32 OLED, always on
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# 128x32 widget restrictions
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=n
CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=n
CONFIG_ZMK_DONGLE_DISPLAY_LAYER=y
CONFIG_LV_Z_VDB_SIZE=32

CONFIG_ZMK_STUDIO=n
