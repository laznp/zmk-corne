# Dongle identity and role
CONFIG_ZMK_KEYBOARD_NAME="Corne"
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Battery reporting (proxy from peripherals to host)
# CONFIG_BT_BAS=y
# CONFIG_BT_PRIVACY=n
# CONFIG_ZMK_BATTERY_REPORTING=y
# CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Power settings
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# No sleep for dongle
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=0

# Display — dongle_display + i2c_oled shields enable hardware + LVGL

# Dongle display - 128x32 OLED (widget configs)
# Disable widgets that need more vertical space
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=n
CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=n
CONFIG_ZMK_DONGLE_DISPLAY_LAYER=n

# Reduce VDB size for 128x32 (smaller buffer)
CONFIG_LV_Z_VDB_SIZE=32

